server {
  listen 80 default_server;
  server_name 194.67.121.63 _;

  return 301 https://reko-med.ru$request_uri;
}

server {
  listen 80;
  server_name reko-med.ru www.reko-med.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
  }

  location / {
    return 301 https://reko-med.ru$request_uri;
  }
}

server {
  listen 443 ssl http2 default_server;
  server_name 194.67.121.63 _;

  ssl_certificate /etc/letsencrypt/live/reko-med.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/reko-med.ru/privkey.pem;

  return 301 https://reko-med.ru$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.reko-med.ru;

  ssl_certificate /etc/letsencrypt/live/reko-med.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/reko-med.ru/privkey.pem;

  return 301 https://reko-med.ru$request_uri;
}

server {
  listen 443 ssl http2;
  server_name reko-med.ru;

  client_max_body_size 50m;

  ssl_certificate /etc/letsencrypt/live/reko-med.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/reko-med.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/xml
    font/opentype
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location ~ /\.(?!well-known) {
    deny all;
  }

  location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /api/payload/media/file/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location ^~ /upload/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
