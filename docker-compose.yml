services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rekomed
      POSTGRES_USER: rekomed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekomed -d rekomed"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-rekomed-app:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://rekomed:${POSTGRES_PASSWORD:-change-me}@postgres:5432/rekomed
      NEXT_PUBLIC_SITE_URL: https://reko-med.ru
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - lead_storage:/app/var
      - media_storage:/app/media

volumes:
  postgres_data:
  lead_storage:
  media_storage:
